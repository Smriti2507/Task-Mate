
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Mate - Add Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">Task Mate</a>

        <div class="d-flex flex-wrap gap-2">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="my-tasks.html">My Tasks</a>
            <a class="nav-link" href="completed.html">Completed</a>
            <a class="nav-link" href="profile.html">Profile</a>
        </div>
    </div>
</nav>

<div class="container page-container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="custom-card">

                <h2 class="main-heading text-center mb-4">
                    Add New Task
                </h2>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Task Title</label>
                        <input type="text" class="form-control"
                               placeholder="Enter task name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3"
                                  placeholder="Enter description"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select class="form-select">
                            <option>Select Priority</option>
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select">
                            <option>Select Category</option>
                            <option>Study</option>
                            <option>Personal</option>
                            <option>Work</option>
                        </select>
                    </div>

                    <a href="my-tasks.html"
                       class="btn btn-purple w-100 mt-3">
                        Add Task
                    </a>

                </form>

            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Task Mate | Daily Task Planner</p>
</footer>

</body>
</html>
