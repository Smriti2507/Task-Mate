
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Mate - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">Task Mate</a>
        <a class="nav-link" href="index.html">Home</a>
    </div>
</nav>

<div class="container page-container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="custom-card">

                <h2 class="main-heading text-center mb-3">
                    Welcome Back!
                </h2>

                <p class="text-center text-secondary">
                    Login to your Task Mate account
                </p>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control"
                               placeholder="Enter your password">
                    </div>

                    <a href="dashboard.html"
                       class="btn btn-purple w-100 mt-3">
                        Login
                    </a>

                </form>

                <p class="text-center mt-4">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Task Mate | Daily Task Planner</p>
</footer>

</body>
</html>
